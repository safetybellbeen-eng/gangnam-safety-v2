<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>강남구 사업장 안전지도 V2</title>
<link rel="manifest" href="manifest.json">
<!-- STEP16: iOS Safari는 manifest.json의 icons를 읽지 않고 홈 화면 추가 시 이 태그만 본다.
     기존 icon(assets/icons/icon-192.png, 태극 원본을 리사이즈만 한 실제 asset)을 그대로 재사용한다. -->
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/map.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div id="app">
  <!-- STEP 3B: 인증 테스트용 최소 화면. 각 상태별 섹션은 app.js가 display 전환한다. -->

  <section id="view-login">
    <h1>강남구 사업장 안전지도 V2</h1>
    <form id="login-form">
      <label>이메일 <input type="email" id="login-email" required></label>
      <label>비밀번호 <input type="password" id="login-password" required></label>
      <button type="submit">로그인</button>
    </form>
    <p id="login-error" class="form-error"></p>
    <button type="button" id="show-signup">회원가입</button>
  </section>

  <section id="view-signup" style="display:none">
    <h1>회원가입</h1>
    <form id="signup-form">
      <label>이름(소속) <input type="text" id="signup-name" required></label>
      <label>이메일 <input type="email" id="signup-email" required></label>
      <label>비밀번호 <input type="password" id="signup-password" required></label>
      <button type="submit">가입하기</button>
    </form>
    <p id="signup-error" class="form-error"></p>
    <button type="button" id="show-login">로그인으로 돌아가기</button>
  </section>

  <section id="view-signup-done" style="display:none">
    <h1>가입 완료</h1>
    <p>관리자 승인 대기 중입니다. 승인 후 로그인해주세요.</p>
    <button type="button" id="signup-done-to-login">로그인으로 이동</button>
  </section>

  <section id="view-pending" style="display:none">
    <h1>승인 대기 중</h1>
    <p>관리자 승인을 기다리고 있습니다.</p>
    <button type="button" id="logout-pending">로그아웃</button>
  </section>

  <section id="view-rejected" style="display:none">
    <h1>가입이 거절되었습니다</h1>
    <p>문의사항은 관리자에게 연락해주세요.</p>
    <button type="button" id="logout-rejected">로그아웃</button>
  </section>

  <section id="view-disabled" style="display:none">
    <h1>사용이 중지된 계정입니다</h1>
    <p>문의사항은 관리자에게 연락해주세요.</p>
    <button type="button" id="logout-disabled">로그아웃</button>
  </section>

  <section id="view-approved" style="display:none">
    <!-- STEP15-C/E.1/E.1-2: 모바일 전용 공통 헤더. PC에서는 css/mobile.css가 항상 숨김 처리한다.
         고용노동부 공식 CI는 태극 문양+"고용노동부" 글자가 한 덩어리인 원본 가로 조합형 이미지를
         그대로(비율/색상/글자 변경 없이) 사용하고, 외곽 흰 여백만 crop해 assets/icons/moel-ci-full.png로
         저장했다. 이미지 자체에 "고용노동부" 글자가 포함되어 있어 #mobile-app-header-agency
         텍스트는 중복이므로 DOM/구조는 그대로 두고 모바일 CSS에서만 숨긴다(css/mobile.css).
         "산업안전 순찰지도"는 기존 #mobile-app-header-title을 그대로 재사용해 CI 이미지 아래에
         별도 줄로 표시한다. 우측 벨 버튼은 위치/기능 그대로 유지하며, 새 기능이 아니라 기존 "알림"
         하단 탭(.mobile-tab-btn[data-tab="alert"])을 그대로 클릭 위임한다(js/app.js). -->
    <div id="mobile-app-header">
      <div id="mobile-app-header-brand">
        <span id="mobile-app-header-logo-slot" aria-hidden="true"><img src="assets/icons/moel-ci-full.png" alt="고용노동부"></span>
        <span id="mobile-app-header-titles">
          <span id="mobile-app-header-agency">고용노동부</span>
          <span id="mobile-app-header-title">산업안전 순찰지도</span>
        </span>
      </div>
      <button type="button" id="mobile-header-alert-btn" aria-label="알림">
        <svg class="mobile-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 16v-5a6 6 0 1 0-12 0v5l-1.5 2.5h15L18 16Z"/>
          <path d="M9.5 20a2.5 2.5 0 0 0 5 0"/>
        </svg>
      </button>
    </div>
    <h1>인증 완료</h1>
    <p id="approved-role-badge"></p>
    <!-- STEP15-E.1: 아이콘은 <span class="mobile-icon-svg-wrap">로 감싸 PC에서는 기본적으로
         숨기고(css/mobile.css) 모바일에서만 보이게 한다. 버튼 id/텍스트/기존 클릭 핸들러(js/app.js의
         requestCurrentLocation 호출부)는 그대로 유지한다. -->
    <button type="button" id="btn-current-location">
      <span class="mobile-icon-svg-wrap" aria-hidden="true">
        <svg class="mobile-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/>
        </svg>
      </span>
      <span>현재 위치</span>
    </button>
    <span id="location-message"></span>
    <button type="button" id="btn-admin-panel" style="display:none">회원 관리</button>
    <div id="admin-panel" style="display:none"></div>
    <button type="button" id="btn-upload-panel" style="display:none">엑셀 업로드</button>
    <div id="upload-panel" style="display:none">
      <!-- STEP15-E.6: admin-panel과 달리 upload-panel 내부는 renderUploadHistoryPanel/
           handleExcelFileSelect가 upload-history/upload-preview만 부분적으로 다시 그리고
           패널 전체를 지우지 않으므로, 닫기 버튼을 정적으로 둔다. PC에서는 css/mobile.css의
           기본값(.mobile-panel-close-btn)이 항상 숨기므로 PC 화면은 그대로다. -->
      <button type="button" id="btn-upload-close" class="mobile-panel-close-btn" aria-label="닫기">×</button>
      <input type="file" id="upload-file-input" accept=".xlsx,.xls">
      <div id="upload-history"></div>
      <div id="upload-preview"></div>
    </div>
    <button type="button" id="btn-supervision-panel" style="display:none">감독일정</button>
    <div id="supervision-panel" style="display:none">
      <div id="supervision-panel-header">
        <div>
          <h2>감독일정 상황판</h2>
          <p id="supervision-panel-subtitle">예정 · 진행중 · 완료 일정 관리</p>
        </div>
        <button type="button" id="btn-supervision-close" aria-label="닫기">×</button>
      </div>
      <div id="supervision-filter-bar">
        <button type="button" class="sv-filter-btn" data-filter="all">전체</button>
        <button type="button" class="sv-filter-btn" data-filter="scheduled">예정</button>
        <button type="button" class="sv-filter-btn" data-filter="ongoing">진행중</button>
        <button type="button" class="sv-filter-btn" data-filter="done">완료</button>
        <button type="button" id="btn-sv-new" style="display:none">+ 새 감독일정 등록</button>
      </div>
      <div id="supervision-form" style="display:none">
        <input type="hidden" id="sv-id">
        <label>감독명 <input type="text" id="sv-title"></label>
        <label>담당자 <input type="text" id="sv-manager"></label>
        <!-- 연도 입력 폭주(예: 202609) 방지 및 SUPERVISION_MIN_DATE/MAX_DATE(js/ui.js)와 동일한
             범위로 브라우저 네이티브 날짜 스피너 자체를 제한한다. -->
        <label>시작일 <input type="date" id="sv-start" min="2000-01-01" max="2100-12-31"></label>
        <label>종료일 <input type="date" id="sv-end" min="2000-01-01" max="2100-12-31"></label>
        <!-- 상태(예정/진행중/완료)는 더 이상 수동 선택하지 않는다. 저장 시 오늘 날짜와
             시작일/종료일을 비교해 js/ui.js의 computeSupervisionStatus()가 자동으로 계산한다. -->
        <button type="button" id="btn-sv-save">저장</button>
        <button type="button" id="btn-sv-cancel">취소</button>
        <p id="supervision-form-error"></p>
      </div>
    </div>
    <div id="site-list-panel">
      <div id="site-search-bar">
        <div id="site-search-input-wrap">
          <!-- STEP15-E.1: 검색 아이콘. 기존 #site-search-input/state/이벤트는 전혀 건드리지 않고
               장식용 아이콘만 추가한다. PC에서는 기본적으로 숨김(css/mobile.css). -->
          <span class="mobile-icon-svg-wrap mobile-search-icon" aria-hidden="true">
            <svg class="mobile-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="6.5"/>
              <path d="m20 20-3.8-3.8"/>
            </svg>
          </span>
          <input type="text" id="site-search-input" placeholder="사업장명, 업체명, 주소, 동으로 검색">
          <button type="button" id="site-search-clear-btn" style="display:none" aria-label="검색어 지우기">×</button>
        </div>
        <!-- STEP15-C.1: 동/금액/정렬 select + 기존 #site-toggle-filter-row를 새 #site-filter-row로
             감쌌다. #site-filter-row는 PC에서는 css/mobile.css가 display:contents로 처리해
             박스를 만들지 않으므로(자식들이 그대로 #site-search-bar의 flex-column 항목으로 승격됨)
             PC 레이아웃/렌더링에 전혀 영향이 없다. 모바일에서만 실제 flex 컨테이너로 바뀌어
             검색창(1행) 아래 필터들을 한 줄 가로 스크롤(2행)로 묶는다. id/속성/이벤트 바인딩 대상은
             변경하지 않아 renderDongOptions()/bindSearchAndSort() 등 기존 로직에 영향 없다. -->
        <div id="site-filter-row">
          <!-- 사용자 요청: "관할"(행정동)을 복수 선택할 수 있게 한다. 네이티브 select는 다중선택
               UI가 불편해 표준 HTML details/summary + checkbox 패널로 구성한다(새 라이브러리 없음).
               렌더/이벤트는 js/ui.js의 renderDongOptions()/bindSearchAndSort()가 담당한다. -->
          <details id="site-dong-filter">
            <summary id="site-dong-filter-label">관할</summary>
            <div id="site-dong-filter-panel">
              <button type="button" id="site-dong-filter-clear">전체</button>
              <div id="site-dong-filter-options"></div>
            </div>
          </details>
          <!-- 사용자 요청: 기본 표시 라벨을 "전체"에서 "공사금액"으로, 구간을 50억/120억 기준
               3단계로 변경. -->
          <select id="site-amount-select">
            <option value="all">공사금액</option>
            <option value="under-5b">50억 미만</option>
            <option value="5b-12b">50억 이상 ~ 120억 미만</option>
            <option value="over-12b">120억 이상</option>
          </select>
          <!-- 사용자 요청: "기본순서"는 메인 지도 탭에서는 숨기고(css/mobile.css) 현장 탭에서만
               보이게 한다. select 자체와 옵션 목록은 그대로 유지한다. -->
          <select id="site-sort-select">
            <option value="default">기본순서</option>
            <option value="name-asc">사업장명 가나다순</option>
            <option value="company-asc">업체명 가나다순</option>
            <option value="amount-desc">공사금액 높은순</option>
            <option value="amount-asc">공사금액 낮은순</option>
            <option value="deadline">공사기간 임박순</option>
            <option value="favorite">즐겨찾기 우선</option>
          </select>
          <div id="site-toggle-filter-row">
            <button type="button" id="site-favorite-filter-btn">★ 즐겨찾기</button>
            <!-- 사용자 요청: "점검"/"산재표"를 유/무로 거를 수 있는 필터 추가(공사금액과 동일한
                 기본표기 방식 — 미선택 시 필터명을 그대로 라벨로 보여준다). -->
            <select id="site-inspection-select">
              <option value="all">점검</option>
              <option value="yes">점검 유</option>
              <option value="no">점검 무</option>
            </select>
            <select id="site-accident-report-select">
              <option value="all">산재표</option>
              <option value="yes">산재표 유</option>
              <option value="no">산재표 무</option>
            </select>
          </div>
        </div>
      </div>
      <div id="site-list"></div>
    </div>
    <div id="map-container">
      <!-- STEP15-E.1-2: 정확도 범례. #map-container 내부에 넣지만 Kakao Map은 이 컨테이너에
           자신의 지도/컨트롤 div를 추가만 할 뿐 기존 자식을 지우지 않으므로 안전하다(Kakao 자체
           줌/지도타입 컨트롤도 같은 방식으로 컨테이너 안에 얹힌다). 지도 재초기화/마커 로직과는
           무관한 순수 표시용 오버레이이며, 실제 마커 색과 반드시 같은 값(css/mobile.css)을 쓴다. -->
      <div id="mobile-map-legend" aria-hidden="true">
        <span class="mobile-map-legend-item"><span class="mobile-map-legend-dot mobile-map-legend-dot-exact"></span>정확</span>
        <span class="mobile-map-legend-item"><span class="mobile-map-legend-dot mobile-map-legend-dot-estimated"></span>중간</span>
        <span class="mobile-map-legend-item"><span class="mobile-map-legend-dot mobile-map-legend-dot-review"></span>확인필요</span>
      </div>
    </div>
    <div id="site-detail-panel" style="display:none"></div>
    <button type="button" id="logout-approved">로그아웃</button>

    <!-- STEP15-B: 모바일(≤768px) 전용 하단 탭 골격. PC에서는 css/mobile.css가 항상 숨김 처리한다.
         지도/현장/즐겨찾기는 기존 DOM(map-container/site-list-panel)을 그대로 재사용하고,
         경로/알림/더보기는 이번 STEP에서는 최소 placeholder만 둔다(실제 연결은 STEP15-D 이후). -->
    <!-- STEP15-D: 경로 탭. 다중 경유지 등 새 경로 기능은 만들지 않고, 기존 사업장 상세의
         "길찾기"(buildKakaoDirectionsUrl)만 재사용해 현재 선택된 사업장 하나에 대해 보여준다.
         안내 문구는 정적 텍스트, 선택 사업장 유무에 따른 실제 내용은 #mobile-route-content에
         renderMobileRouteView()(js/ui.js)가 채운다. -->
    <div id="mobile-view-route" class="mobile-view">
      <h2 class="mobile-view-title">경로</h2>
      <p class="mobile-view-guide">현장에서 사업장을 선택하면 카카오맵 길찾기를 이용할 수 있습니다.</p>
      <div id="mobile-route-content"></div>
    </div>
    <!-- STEP15-D: 알림 탭. 별도 알림 DB가 없으므로 기존 gnmap_v2_supervisions 감독일정 패널
         (#supervision-panel, renderSupervisionPanel())을 그대로 재사용한다 — 탭을 선택하면
         js/app.js의 activateMobileTab()이 이 패널을 채우고, css/mobile.css가 이 탭에서만
         전체화면으로 보이도록 위치를 override한다. 이 placeholder는 그 전환 사이 잠깐만 보인다. -->
    <div id="mobile-view-alert" class="mobile-view">
      <p class="mobile-placeholder">감독일정을 불러오는 중입니다...</p>
    </div>
    <!-- STEP15-D: 더보기 탭. 회원관리/엑셀업로드/감독일정/로그아웃은 새로 구현하지 않고
         기존 PC 버튼(#btn-admin-panel 등)을 그대로 클릭 위임해 기존 로직만 재사용한다.
         renderMobileMoreMenu()(js/ui.js)가 #mobile-more-content를 채운다. -->
    <div id="mobile-view-more" class="mobile-view">
      <div id="mobile-more-content"></div>
    </div>
    <nav id="mobile-bottom-nav">
      <!-- STEP15-E.1: Unicode 이모지(::before) 대신 inline SVG(외부 아이콘 라이브러리 없음)로 교체.
           data-tab 값/기능/클릭 바인딩(js/app.js)은 전혀 바꾸지 않는다. -->
      <button type="button" class="mobile-tab-btn" data-tab="map">
        <svg class="mobile-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 21s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12Z"/>
          <circle cx="12" cy="9" r="2.2"/>
        </svg>
        <span>지도</span>
      </button>
      <button type="button" class="mobile-tab-btn" data-tab="site">
        <svg class="mobile-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="3" width="16" height="18" rx="1.5"/>
          <path d="M8 7h2M14 7h2M8 11h2M14 11h2M8 15h2M14 15h2"/>
        </svg>
        <span>현장</span>
      </button>
      <button type="button" class="mobile-tab-btn" data-tab="route">
        <svg class="mobile-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="6" cy="6" r="2"/>
          <circle cx="18" cy="18" r="2"/>
          <path d="M6 8v2a4 4 0 0 0 4 4h4a4 4 0 0 1 4 4v0"/>
        </svg>
        <span>경로</span>
      </button>
      <button type="button" class="mobile-tab-btn" data-tab="favorite">
        <svg class="mobile-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
